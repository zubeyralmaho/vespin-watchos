name: VespinWatch

options:
  createIntermediateGroups: true
  groupSortPosition: top
  deploymentTarget:
    watchOS: "11.0"

settings:
  base:
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1

fileGroups:
  - README.md
  - specs

targets:
  VespinWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: watchos-app/Sources
      - path: watchos-app/Resources
    info:
      path: watchos-app/Resources/Info.plist
      properties:
        WKApplication: true
        WKWatchOnly: true
        CFBundleDisplayName: Vespin
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
    settings:
      base:
        PRODUCT_NAME: VespinWatch
        PRODUCT_BUNDLE_IDENTIFIER: com.vespin.watchkitapp
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_VERSION: "6.0"
        INFOPLIST_KEY_CFBundleDisplayName: Vespin
    scheme:
      management:
        shared: true